[pytest]
testpaths = tests
# QT_QPA_PLATFORM=offscreen est posé par tests/conftest.py : l'option `env`
# demanderait le greffon pytest-env, une dépendance de plus pour une ligne.
addopts = -q
filterwarnings =
    error::DeprecationWarning:core.*
    error::DeprecationWarning:widgets.*
    error::DeprecationWarning:windows.*
