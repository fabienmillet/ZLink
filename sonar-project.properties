sonar.projectKey=fabienmillet_ZLink_6337d0e1-b6b1-4ae7-9a8e-9e59e9dafa53

sonar.sources=api,core,widgets,windows,scripts,main.py
sonar.tests=tests
# Version du langage : sans elle, l'analyseur suppose la plus permissive et
# passe à côté des règles propres aux versions récentes.
sonar.python.version=3.11, 3.12, 3.13

# Rapport de couverture. Il est produit par l'étape « Tests et couverture » du
# workflow, AVANT le scan : un chemin correct vers un fichier absent laisse la
# couverture vide côté serveur sans le moindre message.
#   pytest --cov --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=.venv/**,build/**,dist/**,assets/**

# Analysés pour leur QUALITÉ, mais pas comptés dans la couverture : ils sont
# hors mesure côté pytest (voir .coveragerc), et sans cette ligne SonarQube les
# affichait à 0 % — un manque apparent qu'aucun test ne pouvait combler.
#
#   scripts/    : outils de publication, exécutés par la CI, pas par l'application.
#   streamdeck/ : chaîne de construction de l'extension, même nature — elle
#                 bâtit un livrable, elle ne tourne pas dans ZLink.
#   main.py     : le réimporter recharge numpy, qui refuse. Son câblage est
#                 éprouvé par tests/test_main_callbacks.py, avec des doublures.
sonar.coverage.exclusions=scripts/**,streamdeck/*.py,main.py,tools_gpu_watch.py
