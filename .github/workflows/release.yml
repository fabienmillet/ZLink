# SPDX-License-Identifier: GPL-3.0-or-later
# Publication d'une release ZLink.
#
# Deux déclencheurs :
#   - push d'un tag « v* » (ex. v0.1.0) : construit ET publie ;
#   - lancement manuel (workflow_dispatch) : construit, et ne publie que si
#     l'on décoche « dry_run ». C'est le mode à utiliser pour valider la chaîne
#     d'empaquetage sans couper de release.
#
# Prérequis côté dépôt, à faire UNE FOIS :
#   - secret RELEASE_SIGNING_KEY : clé privée Ed25519 en hexadécimal (64 car.),
#     produite par scripts/gen_release_key.py. NE JAMAIS la committer.
#   - core/updater.py : RELEASE_PUBKEY_HEX renseignée avec la clé publique.
#   - variables LIBMPV_URL et LIBMPV_SHA256 : archive libmpv pour Windows et son
#     empreinte. Sans elles, la construction Windows échoue volontairement
#     plutôt que de produire une application sans lecteur vidéo.
#
# Notarisation macOS — FACULTATIVE. Sans ces secrets, la construction se fait
# quand même, mais l'application n'est pas signée : Gatekeeper la refusera sur
# une autre machine que celle qui l'a produite. Elle exige une adhésion au
# programme développeur Apple (99 $/an).
#   - MAC_CERT_P12       : certificat « Developer ID Application » (.p12) en base64
#   - MAC_CERT_PASSWORD  : mot de passe de ce .p12
#   - MAC_SIGN_IDENTITY  : nom de l'identité, ex. « Developer ID Application: … (TEAMID) ».
#                         Sert d'interrupteur : sa seule présence active la
#                         signature. L'empreinte réellement utilisée est lue
#                         dans le trousseau, pour ne pas dépendre d'un espace
#                         ou d'un retour à la ligne dans le secret.
#   - MAC_API_KEY_P8     : clé App Store Connect (.p8) en base64
#   - MAC_API_KEY_ID     : identifiant de cette clé
#   - MAC_API_ISSUER_ID  : identifiant de l'émetteur

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Construire sans publier"
        type: boolean
        default: true
      tag:
        description: "Tag de publication (défaut : v + core/version.py)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Détermine le tag et vérifie qu'il correspond au code. Publier un binaire
  # qui s'annonce sous un autre numéro condamnerait le vérificateur de mise à
  # jour à proposer indéfiniment la même version.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      publish: ${{ steps.calc.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: calc
        shell: bash
        run: |
          CODE=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('core/version.py').read_text()).group(1))")
          echo "version dans le code : $CODE"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG#v}" != "$CODE" ]; then
              echo "::error::Le tag ($TAG) ne correspond pas à __version__ ($CODE)"
              exit 1
            fi
            PUBLISH=true
          else
            TAG="${{ inputs.tag }}"
            [ -n "$TAG" ] || TAG="v$CODE"
            PUBLISH=${{ inputs.dry_run == false }}
          fi
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Tag : $TAG — publication : $PUBLISH"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            artifact: ZLink-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows
            artifact: ZLink-windows-x86_64.zip
          - os: macos-14
            target: macos
            artifact: ZLink-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      # Exposés au niveau du job : une condition « if » ne peut pas lire
      # secrets.* directement, mais elle peut lire env.*.
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          # Le paquet a été renommé avec la version d'API : libmpv1 jusqu'à
          # Ubuntu 22.04, libmpv2 à partir de 24.04. Le runner est épinglé sur
          # 22.04 pour que le binaire produit tourne sur les glibc plus
          # anciennes ; on accepte les deux pour survivre à un changement de
          # runner.
          sudo apt-get install -y libmpv2 \
            || sudo apt-get install -y libmpv1 \
            || { echo "::error::aucun paquet libmpv sur ce runner"; exit 1; }

      - name: Dépendances système (macOS)
        if: matrix.target == 'macos'
        run: |
          # dylibbundler n'est plus nécessaire : PyInstaller rapatrie lui-même
          # les dépendances de libmpv (voir l'étape de vérification plus bas).
          brew install mpv
          # Copiée à la racine : le .spec l'y attend, et l'application la
          # cherchera par ce nom dans son propre paquet. Sans elle, une machine
          # sans Homebrew n'aurait aucun lecteur vidéo.
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" libmpv.2.dylib
          chmod u+w libmpv.2.dylib

      # libmpv n'est pas distribuée par pip : sous Windows elle voyage avec
      # l'application, et son empreinte est vérifiée au démarrage.
      - name: libmpv (Windows)
        if: matrix.target == 'windows'
        shell: bash
        env:
          LIBMPV_URL: ${{ vars.LIBMPV_URL }}
          LIBMPV_SHA256: ${{ vars.LIBMPV_SHA256 }}
        run: |
          if [ -z "$LIBMPV_URL" ] || [ -z "$LIBMPV_SHA256" ]; then
            echo "::error::Variables LIBMPV_URL / LIBMPV_SHA256 absentes — voir l'en-tête du workflow"
            exit 1
          fi
          curl -fsSL "$LIBMPV_URL" -o libmpv.7z
          7z x libmpv.7z -olibmpv
          find libmpv -name 'libmpv-2.dll' -exec cp {} libmpv-2.dll \;
          echo "$LIBMPV_SHA256  libmpv-2.dll" | sha256sum -c -
          sha256sum libmpv-2.dll > libmpv-2.dll.sha256

      - name: Dépendances Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.target }}" != "windows" ]; then
            pip install pyinstaller
            exit 0
          fi
          # Windows : recompiler le bootloader de PyInstaller.
          #
          # Celui livré sur PyPI est identique octet pour octet dans des
          # milliers d'échantillons malveillants — PyInstaller est très employé
          # pour distribuer du maliciel Python. Plusieurs moteurs le signalent
          # donc tel quel, et l'application hérite de détections génériques.
          # Recompilé ici, il n'est dans aucune base.
          #
          # PYINSTALLER_COMPILE_BOOTLOADER est indispensable : le sdist contient
          # déjà les binaires Windows, et « --no-binary » seul les réutiliserait
          # sans rien recompiler (voir hatch_build.py, méthode run()).
          PYINSTALLER_COMPILE_BOOTLOADER=1 \
            pip install --no-binary pyinstaller --no-cache-dir pyinstaller

      # Vérifier plutôt que supposer : un bootloader identique à celui de PyPI
      # signifierait que la recompilation a été court-circuitée, et l'intérêt de
      # l'étape précédente serait nul sans que rien ne le signale.
      - name: Contrôler la recompilation du bootloader (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: python scripts/check_bootloader.py

      # La recette vit dans ZLink.spec : elle embarque les sons, qtawesome, et
      # un second exécutable streamlink que l'application invoque en processus
      # séparé — sans lui, une machine sans streamlink installé n'a pas de vidéo.
      - name: Construction
        run: pyinstaller --noconfirm --clean ZLink.spec

      # libmpv tire elle-même ffmpeg et une vingtaine d'autres bibliothèques,
      # qu'elle charge par des chemins absolus vers /opt/homebrew. Sur une
      # machine sans Homebrew, elle ne se chargerait pas. dylibbundler les
      # rapatrie dans le paquet et réécrit ces chemins.
      # Depuis que libmpv est déclarée en binaire dans le .spec, PyInstaller
      # suit lui-même ses dépendances — ffmpeg, x264, harfbuzz et le reste —
      # les copie dans Contents/Frameworks et réécrit leurs chemins en @rpath.
      # dylibbundler n'a donc plus rien à rapatrier : il tentait de recopier
      # chaque fichier sur lui-même et s'arrêtait en erreur. Reste à VÉRIFIER
      # que plus rien ne pointe hors du paquet.
      - name: Vérifier l'autonomie de libmpv (macOS)
        if: matrix.target == 'macos'
        run: |
          APP="dist/ZLink.app"
          # Un .app produit par PyInstaller 6 n'a pas de dossier _internal : les
          # binaires vont dans Contents/Frameworks, les données dans
          # Contents/Resources, et les deux sont liés symboliquement l'un vers
          # l'autre. On cherche le fichier plutôt que de parier sur sa place.
          DYLIB=$(find "$APP" -name 'libmpv.2.dylib' -type f -print -quit)
          if [ -z "$DYLIB" ]; then
            echo "::error::libmpv.2.dylib introuvable dans le paquet"
            find "$APP" -maxdepth 3 | head -40
            exit 1
          fi
          echo "libmpv trouvée : $DYLIB"
          otool -L "$DYLIB"
          # Une référence à un préfixe Homebrew est une bibliothèque absente de
          # toute machine sans Homebrew : l'application s'y lancerait sans
          # vidéo, et seulement chez l'utilisateur final. On préfère l'échec ici.
          FUITES=$(find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 otool -L 2>/dev/null \
            | grep -E '^[[:space:]]+(/opt/homebrew|/usr/local)/' | sort -u || true)
          if [ -n "$FUITES" ]; then
            echo "::error::des bibliothèques pointent encore hors du paquet"
            echo "$FUITES"
            exit 1
          fi
          echo "Aucune dépendance Homebrew résiduelle."

      - name: Contrôle du paquet
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            RACINE="dist/ZLink.app"
          else
            RACINE="dist/ZLink"
          fi
          # Les dispositions diffèrent d'une plateforme à l'autre (onedir avec
          # _internal, .app avec Frameworks/Resources) : on cherche, on ne
          # suppose pas. Un fichier absent doit dire lequel, pas où on l'a cru.
          verifie() { # verifie <motif> <libellé>
            if ! find "$RACINE" -name "$1" -print -quit | grep -q .; then
              echo "::error::$2 absent du paquet ($1)"
              find "$RACINE" -maxdepth 3 | head -40
              exit 1
            fi
            echo "  ok : $1"
          }
          verifie 'milestone.wav' 'sons'
          case "${{ matrix.target }}" in
            windows) verifie 'libmpv-2.dll'   'libmpv' ;;
            macos)   verifie 'libmpv.2.dylib' 'libmpv' ;;
          esac
          # streamlink est un exécutable à part, toujours posé à côté du
          # programme principal.
          if [ "${{ matrix.target }}" = "macos" ]; then
            BIN="$RACINE/Contents/MacOS"
          else
            BIN="$RACINE"
          fi
          if [ "${{ matrix.target }}" = "windows" ]; then
            "$BIN/streamlink.exe" --version || { echo "::error::streamlink embarqué inopérant"; exit 1; }
          else
            "$BIN/streamlink" --version || { echo "::error::streamlink embarqué inopérant"; exit 1; }
          fi

      # ── macOS : signature, notarisation, agrafage ────────────────────
      # Sans certificat configuré, on saute tout : la construction reste utile
      # pour valider l'empaquetage, mais l'application sera refusée par
      # Gatekeeper sur une autre machine que celle qui l'a produite.
      - name: Certificat de signature (macOS)
        if: matrix.target == 'macos' && env.MAC_CERT_P12 != ''
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > certificat.p12
          security create-keychain -p motdepasse build.keychain
          security unlock-keychain -p motdepasse build.keychain
          # Sans réglage, un trousseau se reverrouille de lui-même au bout de
          # quelques minutes : la signature échouerait en cours de route.
          security set-keychain-settings -lut 3600 build.keychain
          security import certificat.p12 -k build.keychain \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k motdepasse build.keychain >/dev/null
          # codesign ne consulte PAS le trousseau « par défaut » mais la LISTE
          # DE RECHERCHE, que « default-keychain » ne touche pas. Sans cette
          # ligne, le certificat est bien importé et reste introuvable :
          # « no identity found », autant de fois qu'il y a de binaires.
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          rm -f certificat.p12
          # On signera par EMPREINTE et non par nom : insensible à un espace ou
          # un retour à la ligne parasite dans le secret, et on vérifie ici que
          # l'identité est réellement utilisable plutôt que de le découvrir au
          # premier codesign.
          EMPREINTE=$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$EMPREINTE" ]; then
            echo "::error::aucune identité « Developer ID Application » utilisable"
            security find-identity -v -p codesigning build.keychain || true
            exit 1
          fi
          echo "SIGN_HASH=$EMPREINTE" >> "$GITHUB_ENV"
          echo "Identité de signature : $EMPREINTE"

      - name: Signer (macOS)
        if: matrix.target == 'macos' && env.MAC_SIGN_IDENTITY != ''
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          APP="dist/ZLink.app"
          signe() { codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist --sign "$SIGN_HASH" "$@"; }

          # Signer d'ABORD tout ce qui est imbriqué, du plus profond vers la
          # racine. Apple déconseille --deep, qui rate certains cas.
          #
          # Repérer les binaires par extension ne suffit pas : un paquet Qt
          # contient des exécutables sans extension (Contents/MacOS/ZLink,
          # streamlink, QtWebEngineProcess). On demande donc à « file » ce qui
          # est du code, et on trie du plus profond au moins profond.
          # -type f écarte les liens symboliques que PyInstaller pose entre
          # Contents/Frameworks et Contents/Resources : les suivre signerait
          # deux fois la même cible.
          find "$APP" -type f -print0 \
            | xargs -0 file --mime-type \
            | grep 'application/x-mach-binary' \
            | sed 's/: *application\/x-mach-binary$//' \
            | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2- \
            > /tmp/machos.txt
          echo "$(wc -l < /tmp/machos.txt) binaires Mach-O à signer"
          while IFS= read -r f; do signe "$f"; done < /tmp/machos.txt

          # Les .framework et les .app imbriqués (QtWebEngineProcess) sont des
          # PAQUETS : signer leur exécutable ne scelle pas le paquet, et la
          # notarisation refuse un paquet imbriqué non scellé.
          find "$APP" \( -type d -name '*.framework' \) -print0 \
            | xargs -0 -I{} sh -c 'codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist --sign "$1" "$2"' _ "$SIGN_HASH" {}
          find "$APP" -mindepth 1 -type d -name '*.app' -print0 \
            | xargs -0 -I{} sh -c 'codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist --sign "$1" "$2"' _ "$SIGN_HASH" {}

          signe "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notariser (macOS)
        if: matrix.target == 'macos' && env.MAC_API_KEY_ID != ''
        env:
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER_ID: ${{ secrets.MAC_API_ISSUER_ID }}
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}
        run: |
          echo "$MAC_API_KEY_P8" | base64 --decode > cle_api.p8
          IDENT=(--key cle_api.p8 --key-id "$MAC_API_KEY_ID" --issuer "$MAC_API_ISSUER_ID")
          # ditto, pas zip : l'archive envoyée à Apple doit conserver les liens
          # symboliques et les permissions du paquet, ce que zip écrase.
          ditto -c -k --keepParent dist/ZLink.app notarisation.zip

          set +e
          xcrun notarytool submit notarisation.zip "${IDENT[@]}" \
            --wait --timeout 30m --output-format json > soumission.json
          set -e
          cat soumission.json

          ID=$(/usr/bin/python3 -c "import json;print(json.load(open('soumission.json'))['id'])")
          ETAT=$(/usr/bin/python3 -c "import json;print(json.load(open('soumission.json'))['status'])")
          if [ "$ETAT" != "Accepted" ]; then
            # Sans ce journal, un refus ne dit rien : « Invalid » et rien d'autre.
            # Apple y détaille chaque binaire fautif et la raison.
            echo "::error::notarisation refusée ($ETAT) — journal d'Apple ci-dessous"
            xcrun notarytool log "$ID" "${IDENT[@]}" || true
            rm -f cle_api.p8 notarisation.zip
            exit 1
          fi
          # Le journal reste utile même en cas d'acceptation : il signale les
          # avertissements qui deviendront des refus dans une version future.
          xcrun notarytool log "$ID" "${IDENT[@]}" || true

          # Agrafer le ticket : l'application se lance alors même hors ligne.
          xcrun stapler staple dist/ZLink.app
          xcrun stapler validate dist/ZLink.app
          rm -f cle_api.p8 notarisation.zip

      - name: Empaqueter (Linux / macOS)
        if: matrix.target != 'windows'
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            # ditto conserve les liens symboliques et le bit exécutable, que
            # zip écrase — une .app dézippée avec zip ne se lance pas.
            ditto -c -k --keepParent dist/ZLink.app "${{ matrix.artifact }}"
          else
            cd dist && tar -czf "../${{ matrix.artifact }}" ZLink
          fi

      - name: Empaqueter (Windows)
        if: matrix.target == 'windows'
        run: Compress-Archive -Path dist/ZLink -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Signer les artefacts
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret RELEASE_SIGNING_KEY absent — release refusée"
            exit 1
          fi
          pip install pycryptodome
          python scripts/sign_release.py artifacts/*

      - name: Empreintes SHA-256
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Installation

            **Windows** — décompressez `ZLink-windows-x86_64.zip` où vous
            voulez et lancez `ZLink.exe`. Aucune installation : le dossier est
            autonome et se déplace, y compris sur une clé.

            **macOS** — décompressez `ZLink-macos-arm64.zip` et glissez
            `ZLink.app` dans Applications. L'application est signée et
            notarisée par Apple.

            **Linux** — décompressez l'archive et lancez `ZLink`. `mpv` doit
            être installé sur le système (`dnf install mpv` /
            `apt install libmpv2`).

            **Vérifiez l'intégrité avant d'exécuter :** chaque artefact est
            accompagné d'une signature `.sig` (Ed25519) et son empreinte figure
            dans `SHA256SUMS`.

            ZLink est distribué sous **GNU GPL v3 ou ultérieure**. Les sources
            correspondant à cette version sont celles du tag ci-dessus.
