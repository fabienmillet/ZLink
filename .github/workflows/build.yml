name: Build

on:
  push:
    branches:
      - main


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # PyQt6 tourne en mode « offscreen » pendant les tests, mais ses
      # bibliothèques natives sont chargées quand même : sans ces paquets,
      # l'import échoue avant qu'un seul test ne démarre.
      #
      # Trois familles, et chacune a coûté un échec de CI :
      #   QtWidgets    — EGL, GL, xkbcommon, la série xcb
      #   QtMultimedia — PulseAudio et ALSA (core/sounds.py)
      #   QtWebEngine  — NSS, ATK, GBM… importé au niveau module par
      #                  windows/panel.py, donc chargé par presque tous les tests
      #
      # Les paquets sont installés UN PAR UN et les échecs tolérés : Ubuntu a
      # renommé plusieurs d'entre eux en « t64 » lors de la transition 64 bits
      # de time_t, et les deux graphies coexistent selon l'image du runner. Un
      # nom absent ne doit pas faire tomber l'étape ; c'est la vérification
      # d'import, juste après, qui tranche.
      - name: Bibliothèques système de Qt
        run: |
          sudo apt-get update
          for paquet in \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libpulse0 libasound2t64 libasound2 \
            libnss3 libnspr4 libxdamage1 libxrandr2 libxcomposite1 \
            libxfixes3 libxtst6 libdrm2 libgbm1 libpango-1.0-0 libcairo2 \
            libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 \
            libatk-bridge2.0-0 libcups2t64 libcups2
          do
            sudo apt-get install -y --no-install-recommends "$paquet" \
              || echo "  (absent de cette image : $paquet)"
          done

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Le diagnostic AVANT les tests : un import qui échoue ici nomme la
      # bibliothèque manquante en une ligne, au lieu de la faire découvrir au
      # milieu d'une collecte pytest interrompue.
      - name: Qt s'importe-t-il ?
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'FIN'
          import importlib
          import sys

          manquants = []
          for module in ("PyQt6.QtWidgets", "PyQt6.QtMultimedia",
                         "PyQt6.QtWebEngineWidgets", "pyqtgraph", "qtawesome"):
              try:
                  importlib.import_module(module)
                  print(f"  ok      {module}")
              except Exception as exc:
                  print(f"  ECHEC   {module} : {exc}")
                  manquants.append(module)
          sys.exit(1 if manquants else 0)
          FIN

      # Le rapport que SonarQube attend. Sans cette étape, coverage.xml
      # n'existe pas au moment du scan et la couverture reste vide côté
      # serveur, quelle que soit la configuration.
      #
      # libmpv n'est pas installée ici : mpv_widget le détecte, journalise, et
      # la lecture vidéo se désactive — les tests n'en ont pas besoin.
      - name: Tests et couverture
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov --cov-report=xml --cov-report=term

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
